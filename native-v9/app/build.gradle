plugins { id 'com.android.application' }

android {
    namespace 'com.nutrijap.v9'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nutrijap.v9'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '9.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
