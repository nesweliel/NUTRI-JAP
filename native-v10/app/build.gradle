plugins { id 'com.android.application' }

android {
    namespace 'com.nutrijap.v10'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nutrijap.v10'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '10.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
